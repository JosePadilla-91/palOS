# palOS: index on battery too (it's light: names only, idle I/O priority).
[Unit]
ConditionACPower=
[Service]
Nice=19
CPUSchedulingPolicy=idle
# Snaps' own files (read-only copies under /snap, snapd's store) aren't things to find by name.
ExecStart=
ExecStart=/usr/sbin/updatedb.plocate --add-prunefs squashfs --add-prunepaths "/snap /var/lib/snapd"
