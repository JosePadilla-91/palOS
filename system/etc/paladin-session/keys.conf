# palOS's keys: what pressing them does anywhere on the desktop (paladin-sessiond).
#   key   modifiers (- for none; Control, Shift, Alt, Super, joined by +; add Release to act when let go)   command
XF86AudioRaiseVolume   -              /usr/lib/paladin-session/paladin-session-helper key volume-up
XF86AudioLowerVolume   -              /usr/lib/paladin-session/paladin-session-helper key volume-down
XF86AudioMute          -              /usr/lib/paladin-session/paladin-session-helper key mute
XF86AudioMicMute       -              /usr/lib/paladin-session/paladin-session-helper key mic-mute
XF86MonBrightnessUp    -              /usr/lib/paladin-session/paladin-session-helper key brightness-up
XF86MonBrightnessDown  -              /usr/lib/paladin-session/paladin-session-helper key brightness-down
XF86AudioPlay          -              /usr/lib/paladin-session/paladin-session-helper key play
XF86AudioNext          -              /usr/lib/paladin-session/paladin-session-helper key next
XF86AudioPrev          -              /usr/lib/paladin-session/paladin-session-helper key previous
XF86AudioStop          -              /usr/lib/paladin-session/paladin-session-helper key stop
l                      Control+Alt    /usr/lib/paladin-session/paladin-session-helper key lock
t                      Control+Alt    /usr/lib/paladin-session/paladin-session-helper key terminal
Print                  -              palos-screenshot
Print                  Shift+Release  palos-screenshot area
Print                  Alt            palos-screenshot window
Print                  Control        palos-screenshot screen --clipboard
s                      Super+Alt      palos-screen-reader --cmd toggle
space                  Super+Alt      palos-screen-reader --cmd again
w                      Super+Alt      palos-screen-reader --cmd title
a                      Super+Alt      palos-screen-reader --cmd all
l                      Super+Alt      palos-screen-reader --cmd line
t                      Super+Alt      palos-screen-reader --cmd time
Up                     Super+Alt      palos-screen-reader --cmd faster
Down                   Super+Alt      palos-screen-reader --cmd slower
k                      Super+Alt      palos-screen-reader --cmd echo
