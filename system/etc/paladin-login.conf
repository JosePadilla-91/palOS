# palOS login (paladin-login). More settings can go in /etc/paladin-login.d/NAME.conf (read in name order).
default-session=paladin
sessions-dirs=/usr/share/xsessions:/usr/lib/palos-firstboot/sessions
display-setup-script=/usr/lib/palos-boot/pointer-home
session-setup-script=/usr/lib/palos-boot/pointer-home
