<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' seeker: file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="panel.css">
<style>
  .body { display: flex; flex-direction: column; align-items: center; padding: 14px 18px 18px; background: linear-gradient(#f2f2f2, #e2e2e2); }
  .logo { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; margin: 4px 0 6px; }
  .logo img { max-width: 96px; max-height: 96px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  .shield { width: 116px; height: 92px; background: linear-gradient(160deg, #9fb6d9, #3b5e98 55%, #1d3460); -webkit-mask: url(seeker://asset/shield-256.png) center / contain no-repeat; position: relative; }
  .name { font-size: 26px; font-weight: bold; color: #333; letter-spacing: -.5px; text-shadow: 0 1px 0 #fff; }
  .ver { font-size: 12px; color: #555; margin: 2px 0 12px; }
  table { font-size: 11px; border-collapse: collapse; margin: 8px 0; }
  td { padding: 2px 4px; vertical-align: top; }
  td:first-child { text-align: right; font-weight: bold; color: #333; white-space: nowrap; }
  td:last-child { color: #222; }
  .copy { font-size: 10px; color: #777; margin-top: auto; text-align: center; padding-top: 10px; }
  .desc { font-size: 12px; color: #444; text-align: center; margin: 4px 10px 10px; }
</style>
<link rel="stylesheet" href="paladin.css">
</head>
<body>
<div class="window rounded">
  <div class="chrome"><div class="titlebar"><div class="lights"></div><div class="title" id="title"></div></div></div>
  <div class="body" id="body"></div>
</div>
<script src="common.js"></script>
<script src="about.js"></script>
</body>
</html>
