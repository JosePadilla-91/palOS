<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' seeker: file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="panel.css">
<style>
  .body { display: flex; gap: 14px; padding: 16px 18px 0; }
  .body svg { width: 52px; height: 52px; flex: none; }
  .msg { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
  .sub { font-size: 11px; margin-bottom: 10px; }
  label { font-size: 12px; display: flex; align-items: center; gap: 8px; }
  input { flex: 1; }
</style>
<link rel="stylesheet" href="paladin.css">
</head>
<body>
<div class="window rounded">
  <div class="chrome"><div class="titlebar"><div class="lights"></div><div class="title">Wi-Fi</div></div></div>
  <div class="body">
    <svg viewBox="0 0 20 16"><path d="M1.5 6.2a12 12 0 0 1 17 0" stroke="#3a6fd8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M4.4 9a8 8 0 0 1 11.2 0" stroke="#3a6fd8" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M7.3 11.8a4 4 0 0 1 5.4 0" stroke="#3a6fd8" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="10" cy="14.3" r="1.4" fill="#3a6fd8"/></svg>
    <div style="flex:1">
      <div class="msg" id="msg"></div>
      <div class="sub">Enter the password for this network.</div>
      <label id="userRow" style="display:none;margin-bottom:6px">Name: <input type="text" id="user" spellcheck="false" autocomplete="off"></label>
      <label>Password: <input type="password" id="pw"></label>
      <label class="check" style="margin-top:6px"><input type="checkbox" id="show" style="flex:none"> Show password</label>
    </div>
  </div>
  <div class="footer"><button class="btn" id="cancel">Cancel</button><button class="btn default" id="ok">Join</button></div>
</div>
<script src="common.js"></script>
<script src="prompt.js"></script>
</body>
</html>
