<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' seeker: file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="panel.css">
<style>
  .body { background: #ececec; font-size: 11px; }
  .head { display: flex; gap: 8px; padding: 10px 12px; align-items: center; border-bottom: 1px solid #c8c8c8; }
  .head img { width: 32px; height: 32px; }
  .head .n { font-size: 13px; font-weight: bold; word-break: break-all; }
  .head .s { margin-left: auto; font-size: 11px; white-space: nowrap; }
  .head .m { color: #555; font-size: 10px; }
  .sec { border-bottom: 1px solid #c8c8c8; }
  .sec > .st { display: flex; align-items: center; padding: 5px 8px; font-weight: bold; font-size: 11px; }
  .sec > .sc { padding: 2px 12px 10px 24px; }
  .sec.closed > .sc { display: none; }
  table.kv { border-collapse: collapse; width: 100%; }
  table.kv td { padding: 1px 3px; vertical-align: top; }
  table.kv td:first-child { text-align: right; font-weight: bold; white-space: nowrap; width: 72px; }
  table.kv td:last-child { word-break: break-word; user-select: text; }
  .pv { display: flex; justify-content: center; padding: 6px 0; }
  .pv img { max-width: 240px; max-height: 180px; object-fit: contain; }
  .perm { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #a8a8a8; margin-top: 4px; }
  .perm th { text-align: left; font-weight: normal; background: linear-gradient(#fdfdfd, #e3e3e3); border-bottom: 1px solid #a8a8a8; padding: 1px 4px; }
  .perm td { padding: 1px 4px; }
  .perm tr:nth-child(even) td { background: #edf3fe; }
  .perm select { height: 18px; font-size: 11px; }
  input.nm { width: 100%; font-size: 11px; }
  select.ow { width: 100%; }
</style>
<link rel="stylesheet" href="paladin.css">
</head>
<body>
<div class="window rounded">
  <div class="chrome"><div class="titlebar"><div class="lights"></div><div class="title" id="title"></div></div></div>
  <div class="body" id="body"></div>
</div>
<script src="common.js"></script>
<script src="info.js"></script>
</body>
</html>
