<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' seeker: file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="panel.css">
<style>
  .body { padding: 12px 16px 0; display: flex; flex-direction: column; }
  .intro { font-size: 12px; margin-bottom: 8px; }
  .list { flex: 1; background: #fff; border: 1px solid #9a9a9a; overflow: auto; min-height: 0; }
  .row { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px; font-size: 13px; }
  .row img { width: 18px; height: 18px; }
  .row.sel { background: linear-gradient(#5e8fe2, #3166d1); color: #fff; }
  .hint { font-size: 11px; color: #555; margin: 8px 0 0; }
</style>
<link rel="stylesheet" href="paladin.css">
</head>
<body>
<div class="window rounded">
  <div class="chrome"><div class="titlebar"><div class="lights"></div><div class="title">Force Quit Applications</div></div></div>
  <div class="body">
    <div class="intro">If an application doesn’t respond for a while, select its name and click Force Quit.</div>
    <div class="list" id="list"></div>
    <div class="hint">You can open this window from the palOS menu.</div>
  </div>
  <div class="footer"><button class="btn default" id="fq" disabled>Force Quit</button></div>
</div>
<script src="common.js"></script>
<script src="forcequit.js"></script>
</body>
</html>
