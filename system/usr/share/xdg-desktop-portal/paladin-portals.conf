# Desktop portals for the Paladin session (XDG_CURRENT_DESKTOP=Paladin).
# The GTK portal passes the Dark Mode switch (org.gnome.desktop.interface color-scheme)
# on to apps that ask: GTK 4 / libadwaita, Electron, Firefox and Flatpaks.
# Open and Save come from palOS (paladin-portal): Seeker's sheet, under the title bar of the window that asked.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=paladin
org.freedesktop.impl.portal.Secret=gnome-keyring
