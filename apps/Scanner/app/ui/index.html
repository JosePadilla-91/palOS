<!doctype html><html><head><meta charset="utf-8"><title>Scanner</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="scanner.css"></head>
<body>
<div id="app">
  <aside id="side">
    <div class="grp-title">Scanners</div>
    <div id="nav"></div>
    <div class="settings" id="settings"></div>
    <div class="foot"><button class="btn" id="previewBtn">Overview</button><button class="btn primary" id="scanBtn">Scan</button></div>
  </aside>
  <main id="main">
    <div id="stage">
      <div id="bed"><img id="pv" alt=""><div id="crop"><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i><span id="dims"></span></div></div>
      <div id="hint"></div>
      <div id="busy" class="hidden"><div class="bar"><i id="barFill"></i></div><span id="busyText">Scanning the document…</span><button class="btn small" id="cancelBtn">Stop</button></div>
    </div>
    <div id="tray">
      <div id="pages"></div>
      <div class="tray-acts">
        <select id="format"><option value="pdf">PDF</option><option value="jpeg">JPEG</option><option value="png">PNG</option><option value="tiff">TIFF</option></select>
        <label class="inline"><input type="checkbox" id="openAfter"> Open after saving</label>
        <button class="btn primary" id="saveBtn" disabled>Save…</button>
      </div>
    </div>
  </main>
</div>
<script src="helpers.js"></script><script src="scanner.js"></script></body></html>
