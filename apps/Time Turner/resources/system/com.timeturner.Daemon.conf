<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Time Turner's background service. Who may do what is decided by polkit
     (com.timeturner.policy); the bus only controls who may talk to it. -->
<busconfig>
  <policy user="root">
    <allow own="com.timeturner.Daemon"/>
    <allow send_destination="com.timeturner.Daemon"/>
  </policy>
  <policy context="default">
    <allow send_destination="com.timeturner.Daemon"/>
  </policy>
</busconfig>
