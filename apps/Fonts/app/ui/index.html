<!doctype html><html><head><meta charset="utf-8"><title>Fonts</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data: blob:">
<link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="fonts.css"></head>
<body>
<div id="app">
  <aside id="side">
    <div class="sh">Library</div>
    <div id="lib"></div>
    <div class="sh">Collections</div>
    <div id="cols"></div>
    <div class="grow"></div>
    <button class="btn small" id="addBtn">Add Fonts…</button>
  </aside>
  <section id="families">
    <div class="search"><input id="q" type="search" placeholder="Search" spellcheck="false"></div>
    <div id="flist"></div>
    <div class="count" id="count"></div>
  </section>
  <main id="preview">
    <div class="tools">
      <div class="seg" id="modes"></div>
      <span class="grow"></span>
      <select id="face" aria-label="Style"></select>
      <input type="range" id="size" min="9" max="160" step="1" aria-label="Size"><span id="sizeLbl" class="dim"></span>
    </div>
    <div id="pv" data-no-l10n></div>
    <div class="acts" id="acts"></div>
  </main>
</div>
<div id="drop" class="hidden"><div>Drop fonts to preview and install them</div></div>
<div id="toast" class="hidden"></div>
<script src="fonts.js"></script></body></html>
