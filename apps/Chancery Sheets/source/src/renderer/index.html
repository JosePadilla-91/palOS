<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:">
  <title>Chancery Sheets</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar" role="toolbar" aria-label="Formatting">
      <div class="tb-group">
        <button class="tb" data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2 6h7.5a4 4 0 0 1 0 8H7"/></svg></button>
        <button class="tb" data-cmd="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3m3-3H6.5a4 4 0 0 0 0 8H9"/></svg></button>
        <button class="tb" data-cmd="format-painter" title="Paint format (click, then select target)"><svg viewBox="0 0 16 16"><path d="M3 2h9v4H3zM12 4h2v4H8v2M7 10h2v4H7z"/></svg></button>
      </div>
      <div class="tb-group">
        <button class="tb txt" data-nf="&quot;$&quot;#,##0.00" title="Currency">$</button>
        <button class="tb txt" data-nf="0.00%" title="Percent">%</button>
        <button class="tb txt" data-nf="#,##0" title="Thousands separator">,</button>
        <button class="tb txt small" data-cmd="dec-less" title="Decrease decimals">.0</button>
        <button class="tb txt small" data-cmd="dec-more" title="Increase decimals">.00</button>
        <select id="tb-nf" title="Number format">
          <option value="General">General</option>
          <option value="0">Number (0)</option>
          <option value="#,##0.00">Number (1,234.56)</option>
          <option value="&quot;$&quot;#,##0.00">Currency</option>
          <option value="&quot;$&quot;#,##0.00_);[Red](&quot;$&quot;#,##0.00)">Accounting</option>
          <option value="0.00%">Percent</option>
          <option value="0.00E+00">Scientific</option>
          <option value="# ?/?">Fraction</option>
          <option value="yyyy-mm-dd">Date</option>
          <option value="mmmm d, yyyy">Long date</option>
          <option value="hh:mm:ss">Time</option>
          <option value="yyyy-mm-dd hh:mm">Date time</option>
          <option value="@">Text</option>
          <option value="__custom">Custom…</option>
        </select>
      </div>
      <div class="tb-group">
        <select id="tb-font" title="Font">
          <option>Carlito</option><option>Calibri</option><option>Liberation Sans</option><option>Arial</option>
          <option>Ubuntu</option><option>DejaVu Sans</option><option>Noto Sans</option><option>Liberation Serif</option>
          <option>Times New Roman</option><option>Georgia</option><option>Liberation Mono</option><option>DejaVu Sans Mono</option>
          <option>Courier New</option>
        </select>
        <select id="tb-size" title="Font size">
          <option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option>
          <option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option><option>72</option>
        </select>
      </div>
      <div class="tb-group">
        <button class="tb txt" data-cmd="bold" data-toggle="b" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="tb txt" data-cmd="italic" data-toggle="i" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="tb txt" data-cmd="underline" data-toggle="u" title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="tb txt" data-cmd="strike" data-toggle="st" title="Strikethrough (Ctrl+5)"><s>S</s></button>
        <button class="tb color" data-cmd="apply-fc" title="Text color"><span class="glyph">A</span><span class="swatch" id="sw-fc" style="background:#c00000"></span></button>
        <button class="tb color" data-cmd="apply-bg" title="Fill color"><svg viewBox="0 0 16 16"><path d="m3 8 5-5 5 5-5 5zM13 10s1.5 2 1.5 3a1.5 1.5 0 0 1-3 0c0-1 1.5-3 1.5-3"/></svg><span class="swatch" id="sw-bg" style="background:#fff2cc"></span></button>
      </div>
      <div class="tb-group">
        <button class="tb" data-cmd="borders-menu" title="Borders"><svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM8 2v12M2 8h12" stroke-dasharray="1.5 1.5"/><path d="M2 14h12"/></svg></button>
        <button class="tb" data-cmd="merge-toggle" title="Merge / unmerge cells"><svg viewBox="0 0 16 16"><path d="M2 3h12v10H2zM4 8h8M6 6 4 8l2 2M10 6l2 2-2 2"/></svg></button>
      </div>
      <div class="tb-group">
        <button class="tb" data-cmd="align-left" data-align="left" title="Align left"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8"/></svg></button>
        <button class="tb" data-cmd="align-center" data-align="center" title="Center"><svg viewBox="0 0 16 16"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8"/></svg></button>
        <button class="tb" data-cmd="align-right" data-align="right" title="Align right"><svg viewBox="0 0 16 16"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8"/></svg></button>
        <button class="tb" data-cmd="valign-menu" title="Vertical alignment"><svg viewBox="0 0 16 16"><path d="M2 2h12M2 14h12M8 4.5v7M5.5 7 8 4.5 10.5 7M5.5 9 8 11.5 10.5 9"/></svg></button>
        <button class="tb" data-cmd="wrap" data-toggle="wrap" title="Wrap text"><svg viewBox="0 0 16 16"><path d="M2 3h12M2 7h10a2 2 0 0 1 0 4H8m1.5-1.5L8 11l1.5 1.5M2 11h4M2 14h6"/></svg></button>
      </div>
      <div class="tb-group">
        <button class="tb" data-cmd="autosum" title="AutoSum (Alt+=)"><svg viewBox="0 0 16 16"><path d="M12 3H4l4.5 5L4 13h8"/></svg></button>
        <button class="tb txt fx" data-cmd="insert-function" title="Insert function (Shift+F3)"><i>fx</i></button>
        <button class="tb" data-cmd="sort-asc" title="Sort A → Z"><svg viewBox="0 0 16 16"><path d="M4 2v12m-2.5-2.5L4 14l2.5-2.5M9 3h5M9 7h4M9 11h3M9 14h2"/></svg></button>
        <button class="tb" data-cmd="sort-desc" title="Sort Z → A"><svg viewBox="0 0 16 16"><path d="M4 2v12m-2.5-2.5L4 14l2.5-2.5M9 3h2M9 6h3M9 10h4M9 14h5"/></svg></button>
        <button class="tb" data-cmd="toggle-filter" title="Filter (Ctrl+Shift+L)"><svg viewBox="0 0 16 16"><path d="M2 3h12L9.5 8.5V13l-3 1.5v-6z"/></svg></button>
        <button class="tb" data-cmd="insert-chart" title="Insert chart"><svg viewBox="0 0 16 16"><path d="M2 2v12h12M5 11V8m3 3V5m3 6V7"/></svg></button>
        <button class="tb" data-cmd="freeze-menu" title="Freeze panes"><svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM6 2v12M2 6h12"/><path d="M3 3h2v2H3z" fill="currentColor"/></svg></button>
        <button class="tb" data-cmd="find" title="Find and replace (Ctrl+F)"><svg viewBox="0 0 16 16"><path d="M10.5 10.5 14 14M11.5 6.5a5 5 0 1 1-10 0 5 5 0 0 1 10 0"/></svg></button>
      </div>
    </header>

    <div id="formula-bar">
      <input id="name-box" spellcheck="false" aria-label="Cell reference" title="Name box: type a cell or range and press Enter">
      <div class="fb-sep"></div>
      <button id="fx-btn" title="Insert function"><i>fx</i></button>
      <textarea id="formula-input" rows="1" spellcheck="false" aria-label="Cell contents"></textarea>
      <button id="fb-expand" title="Expand formula bar">⌄</button>
    </div>

    <main id="grid-wrap">
      <canvas id="grid-canvas"></canvas>
      <div id="scroller" tabindex="0" aria-label="Spreadsheet grid"><div id="spacer"></div></div>
      <div id="chart-layer"></div>
      <textarea id="cell-editor" rows="1" spellcheck="false" autocomplete="off"></textarea>
      <div id="autocomplete" class="popup hidden"></div>
      <div id="formula-hint" class="hidden"></div>
    </main>

    <footer id="sheet-bar">
      <button id="add-sheet" title="Add sheet (Shift+F11)">+</button>
      <button id="sheet-list" title="All sheets">≡</button>
      <div id="tabs" role="tablist"></div>
      <div id="status"></div>
      <div id="zoom-box"><select id="tb-zoom" title="Zoom">
          <option value="0.5">50%</option><option value="0.75">75%</option><option value="0.9">90%</option>
          <option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option>
        </select></div>
    </footer>
  </div>

  <div id="menu-layer"></div>
  <div id="dialog-layer"></div>
  <div id="toast-layer"></div>

  <script src="../../node_modules/hyperformula/dist/hyperformula.full.min.js"></script>
  <script src="../../node_modules/chart.js/dist/chart.umd.min.js"></script>
  <script src="../../node_modules/xlsx/dist/xlsx.full.min.js"></script>
  <script src="../shared/model.js"></script>
  <script src="js/formula-utils.js"></script>
  <script src="js/format.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/app.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
